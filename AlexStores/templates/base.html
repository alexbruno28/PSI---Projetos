<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}AlexStore{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">AlexStore</div>
      <nav>
        <a href="{{ url_for('user_bp.profile') }}">Perfil</a>
        <a href="{{ url_for('product_bp.list_products') }}">Acessórios</a>
        <a href="{{ url_for('auth.logout') }}">Sair</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">© 2025 AlexStore</footer>
  </div>
</body>
</html>
